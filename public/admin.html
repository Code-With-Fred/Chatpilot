<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ChatPilot — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0a0a0a; --card:#141414; --ink:#f5f5f0; --ink-mute:#8a8a82; --accent:#d4ff00; --border:#1f1f1f; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--ink); font-family: 'Sora', sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 24px 80px; }
  h1 { font-family: 'Instrument Serif', serif; font-size: 40px; font-weight: 400; margin-bottom: 6px; }
  h1 span { color: var(--accent); font-style: italic; }
  .muted { color: var(--ink-mute); font-size: 14px; margin-bottom: 28px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 28px; }
  .card h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
  label { display: block; font-size: 12px; color: var(--ink-mute); margin-bottom: 4px; margin-top: 12px; }
  input, textarea, select { width: 100%; background: #1a1a1a; border: 1px solid var(--border); color: var(--ink);
    padding: 10px 12px; border-radius: 8px; font-family: inherit; font-size: 13px; outline: none; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { resize: vertical; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  button { cursor: pointer; font-family: inherit; }
  .btn { background: var(--accent); color: #000; border: none; padding: 11px 20px; border-radius: 100px;
    font-weight: 600; font-size: 13px; margin-top: 18px; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--ink); padding: 7px 14px;
    border-radius: 100px; font-size: 12px; }
  .btn-danger { background: transparent; border: 1px solid #3a1a1a; color: #e07070; padding: 7px 14px; border-radius: 100px; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--ink-mute); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  code { background: #1a1a1a; padding: 8px 10px; border-radius: 6px; display: block; font-size: 12px;
    overflow-x: auto; white-space: pre; margin-top: 6px; border: 1px solid var(--border); }
  .gate { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 10; }
  .gate-box { width: 320px; text-align: center; }
  .gate-box input { margin-top: 16px; text-align: center; }
  .gate-box button { width: 100%; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 100px; font-size: 11px; background: #1a1a1a; color: var(--ink-mute); }
  .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #status { font-size: 12px; margin-top: 10px; min-height: 16px; }
  #status.ok { color: var(--accent); }
  #status.err { color: #e07070; }
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-box">
    <h1>Chat<span>Pilot</span></h1>
    <p class="muted">Enter your admin key to continue</p>
    <input type="password" id="gateKey" placeholder="Admin key" />
    <button class="btn" id="gateSubmit" style="width:100%">Unlock</button>
    <div id="gateError" style="color:#e07070; font-size:12px; margin-top:10px;"></div>
  </div>
</div>

<div class="wrap" id="app" style="display:none;">
  <h1>Chat<span>Pilot</span> Admin</h1>
  <p class="muted">Onboard a business, grab their embed snippet, and see the leads their widget captures.</p>

  <div class="card">
    <h2>+ Add a new business</h2>
    <div class="row">
      <div>
        <label>Business name *</label>
        <input id="f_businessName" placeholder="e.g. Bright Smile Dental" />
      </div>
      <div>
        <label>Contact email (where leads get sent)</label>
        <input id="f_contactEmail" placeholder="owner@business.com" />
      </div>
    </div>
    <label>About the business</label>
    <textarea id="f_aboutText" rows="2" placeholder="Short description of what they do"></textarea>
    <label>Services / products</label>
    <textarea id="f_services" rows="2"></textarea>
    <label>FAQs</label>
    <textarea id="f_faqs" rows="3" placeholder="Q: ... A: ...  (one per line, as many as you like)"></textarea>
    <div class="row">
      <div>
        <label>Hours</label>
        <input id="f_hours" placeholder="Mon-Fri 9am-6pm" />
      </div>
      <div>
        <label>Booking / scheduling info</label>
        <input id="f_bookingInfo" placeholder="How visitors should book" />
      </div>
    </div>
    <div class="row">
      <div>
        <label>Brand color</label>
        <input id="f_brandColor" type="color" value="#d4ff00" />
      </div>
      <div>
        <label>Greeting message</label>
        <input id="f_greeting" placeholder="Hi 👋 how can we help?" />
      </div>
    </div>
    <button class="btn" id="createClient">Create client</button>
    <div id="status"></div>
  </div>

  <div class="card">
    <h2>Clients & embed snippets</h2>
    <table>
      <thead><tr><th>Business</th><th>Slug</th><th>Embed snippet</th><th>Leads</th><th></th></tr></thead>
      <tbody id="clientsBody"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>Leads</h2>
    <label>Filter by client</label>
    <select id="leadClientFilter"><option value="">All clients</option></select>
    <table style="margin-top:14px;">
      <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Message</th><th>Date</th></tr></thead>
      <tbody id="leadsBody"></tbody>
    </table>
  </div>
</div>

<script>
  let adminKey = localStorage.getItem('chatpilot_admin_key') || '';
  let clients = [];

  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ 'Content-Type': 'application/json', 'x-admin-key': adminKey }, opts.headers || {});
    return fetch(path, opts).then(async (res) => {
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || ('Request failed: ' + res.status));
      return data;
    });
  }

  async function tryUnlock(key) {
    adminKey = key;
    try {
      await api('/api/admin/clients');
      localStorage.setItem('chatpilot_admin_key', adminKey);
      document.getElementById('gate').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      await loadClients();
      await loadLeads();
    } catch (e) {
      document.getElementById('gateError').textContent = e.message;
    }
  }

  document.getElementById('gateSubmit').addEventListener('click', () => {
    tryUnlock(document.getElementById('gateKey').value.trim());
  });
  document.getElementById('gateKey').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') tryUnlock(e.target.value.trim());
  });

  function embedSnippet(client) {
    const origin = window.location.origin;
    return `<script src="${origin}/widget.js" data-client="${client.slug}"><\/script>`;
  }

  function setStatus(msg, ok) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = ok ? 'ok' : 'err';
  }

  async function loadClients() {
    const data = await api('/api/admin/clients');
    clients = data.clients;

    const tbody = document.getElementById('clientsBody');
    tbody.innerHTML = '';
    const filterSel = document.getElementById('leadClientFilter');
    filterSel.innerHTML = '<option value="">All clients</option>';

    clients.forEach((c) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${c.businessName}</td>
        <td><span class="pill">${c.slug}</span></td>
        <td style="max-width:280px;"><code>${embedSnippet(c)}</code></td>
        <td><a href="#" data-id="${c.id}" class="viewLeads" style="color:var(--accent); text-decoration:none;">View →</a></td>
        <td class="actions">
          <button class="btn-ghost copyBtn" data-slug="${c.slug}">Copy snippet</button>
          <button class="btn-danger deleteBtn" data-id="${c.id}">Delete</button>
        </td>`;
      tbody.appendChild(tr);

      const opt = document.createElement('option');
      opt.value = c.id;
      opt.textContent = c.businessName;
      filterSel.appendChild(opt);
    });

    tbody.querySelectorAll('.copyBtn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const client = clients.find((c) => c.slug === btn.dataset.slug);
        navigator.clipboard.writeText(embedSnippet(client));
        btn.textContent = 'Copied!';
        setTimeout(() => (btn.textContent = 'Copy snippet'), 1200);
      });
    });
    tbody.querySelectorAll('.deleteBtn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        if (!confirm('Delete this client and all their leads?')) return;
        await api('/api/admin/clients/' + btn.dataset.id, { method: 'DELETE' });
        await loadClients();
        await loadLeads();
      });
    });
    tbody.querySelectorAll('.viewLeads').forEach((a) => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        document.getElementById('leadClientFilter').value = a.dataset.id;
        loadLeads(a.dataset.id);
      });
    });
  }

  async function loadLeads(clientId) {
    const qs = clientId ? ('?clientId=' + encodeURIComponent(clientId)) : '';
    const data = await api('/api/admin/leads' + qs);
    const tbody = document.getElementById('leadsBody');
    tbody.innerHTML = '';
    data.leads.forEach((l) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${l.name}</td><td>${l.email || '-'}</td><td>${l.phone || '-'}</td>
        <td>${l.message || '-'}</td><td>${new Date(l.createdAt).toLocaleString()}</td>`;
      tbody.appendChild(tr);
    });
  }

  document.getElementById('leadClientFilter').addEventListener('change', (e) => loadLeads(e.target.value));

  document.getElementById('createClient').addEventListener('click', async () => {
    const businessName = document.getElementById('f_businessName').value.trim();
    if (!businessName) { setStatus('Business name is required', false); return; }

    const payload = {
      businessName,
      contactEmail: document.getElementById('f_contactEmail').value.trim(),
      aboutText: document.getElementById('f_aboutText').value.trim(),
      services: document.getElementById('f_services').value.trim(),
      faqs: document.getElementById('f_faqs').value.trim(),
      hours: document.getElementById('f_hours').value.trim(),
      bookingInfo: document.getElementById('f_bookingInfo').value.trim(),
      brandColor: document.getElementById('f_brandColor').value,
      greeting: document.getElementById('f_greeting').value.trim()
    };

    try {
      await api('/api/admin/clients', { method: 'POST', body: JSON.stringify(payload) });
      setStatus('Client created ✅ — embed snippet is in the table below.', true);
      ['f_businessName','f_contactEmail','f_aboutText','f_services','f_faqs','f_hours','f_bookingInfo','f_greeting']
        .forEach((id) => (document.getElementById(id).value = ''));
      await loadClients();
    } catch (e) {
      setStatus(e.message, false);
    }
  });

  if (adminKey) tryUnlock(adminKey);
</script>
</body>
</html>
